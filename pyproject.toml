[project]
name = "photo-ledger"
version = "0.1.0"
description = "Local-first photo catalogue: index backups, detect duplicates and mismatches, review side by side, and organise safely."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "platformdirs>=4.2",
    "typer>=0.12",
    "uvicorn>=0.30",
    "greentechhub-core @ git+https://github.com/GreenMachine582/greentechhub-core.git@v0.16.0",
    "greentechhub-fastapi @ git+https://github.com/GreenMachine582/greentechhub-fastapi.git@v0.18.0",
    "greentechhub-ui @ git+https://github.com/GreenMachine582/greentechhub-ui.git@v0.20.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
photo-ledger = "photo_ledger.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/photo_ledger"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
