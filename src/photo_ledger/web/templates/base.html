{#- Every page: greentechhub-ui's page.html, plus the result of the last action as toasts. -#}
{% extends "page.html" %}
{% from "toast.html" import gth_toast_flashes %}
{% block body_end %}
{%- if flashes %}
<div class="toast-container position-fixed top-0 end-0 p-3 gth-flash-toasts">{{ gth_toast_flashes(flashes) }}</div>
{%- endif %}
{% endblock %}
